name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Refresh player data every night at 4-5am Toronto time (09:00 UTC),
  # so the daily answer never changes while people are playing
  schedule:
    - cron: "0 9 * * *"
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # needed to push refreshed player data back to main
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Data refresh only runs on the nightly schedule or a manual run,
      # so normal code pushes deploy quickly
      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest player data
        if: github.event_name != 'push'
        run: |
          pip install requests
          python scripts/fetch_players.py

      - name: Commit updated player data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "No player data changes"
          else
            git commit -m "Nightly player data refresh"
            git pull --rebase
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-frozen-lockfile

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
